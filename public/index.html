<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Assistant</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --line: #2a313b; --text: #e8ecf1; --muted: #8b95a3;
    --good: #3ecf8e; --warn: #f5b942; --bad: #f2555a; --accent: #6aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .rec { border-color: var(--accent); }
  .rec .label { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
  .rec .choice { font-size: 44px; font-weight: 800; margin: 2px 0 6px; }
  .rec .reason { font-size: 19px; }
  .rec .alt, .meta { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mon h2 { margin: 0 0 6px; font-size: 24px; }
  .mon .side { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .types span, .type { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; margin-right: 4px; }
  .hpbar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 10px 0 4px; }
  .hpbar div { height: 100%; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; }
  td { padding: 7px 6px; border-top: 1px solid var(--line); }
  tr.best td { background: rgba(106,169,255,.08); }
  .bar { position: relative; height: 8px; background: var(--line); border-radius: 4px; min-width: 120px; }
  .bar div { position: absolute; height: 100%; border-radius: 4px; }
  .eff2 { color: var(--good); font-weight: 700; } .eff0 { color: var(--bad); } .effh { color: var(--warn); }
  h3 { margin: 0 0 8px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .thinking { color: var(--muted); font-size: 22px; }
  /* Support note: slides up from the bottom now and then, only while no battle is on. */
  #support { position: fixed; left: 50%; bottom: 12px; transform: translate(-50%, 140%); max-width: min(560px, calc(100% - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted);
    font-size: 13px; display: flex; gap: 12px; align-items: center; opacity: 0; transition: transform .4s ease, opacity .4s ease; pointer-events: none; }
  #support.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #support a { color: var(--text); font-weight: 600; white-space: nowrap; }
  #support button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 0 2px; }
  #moves tr[data-move] { cursor: pointer; }
  #moves tr[data-move]:hover td { background: rgba(255,255,255,.04); }
  .est button { background: var(--line); color: var(--text); border: 0; border-radius: 6px; padding: 3px 8px; margin: 6px 4px 0 0; cursor: pointer; font: inherit; font-size: 13px; }
  .est button:hover { background: var(--accent); }
  .flash { animation: flash 1.2s ease-in-out 3; border-radius: 8px; }
  @keyframes flash { 50% { background: rgba(62,207,142,.18); } }
  @media (max-width: 700px) { .versus { grid-template-columns: 1fr; } .rec .choice { font-size: 32px; } body { padding: 16px; } }
</style>
</head>
<body>
<div id="support" role="note"><span>Finding this useful? It's a one-person project:
  <a href="https://buymeacoffee.com/samabenie" target="_blank" rel="noopener">☕ Buy me a coffee</a>.
  Unofficial fan project, not affiliated with Nintendo / GAME FREAK.</span>
  <button aria-label="Hide" onclick="hideSupport(true)">✕</button></div>
<div class="wrap">
  <div class="panel rec" id="rec"><div class="thinking">Waiting for a battle…</div></div>
  <div class="versus" id="versus"></div>
  <div class="panel" id="trainPanel"><h3 id="trainTitle">Training</h3><div id="train"></div></div>
  <div class="panel" id="catchPanel"><h3>Catch chance (per throw)</h3><div id="catch"></div></div>
  <div class="panel"><h3>Your moves</h3><table id="moves"></table></div>
  <div class="versus">
    <div class="panel"><h3>Enemy threats to you</h3><table id="threats"></table></div>
    <div class="panel"><h3>Switch options</h3><table id="switches"></table></div>
  </div>
  <div class="meta" id="meta"></div>

</div>
<script>
const TYPE = { Normal:"#9fa19f", Fire:"#e62829", Water:"#2980ef", Electric:"#fac000", Grass:"#3fa129", Ice:"#3dcef3", Fighting:"#ff8000", Poison:"#9141cb", Ground:"#915121", Flying:"#81b9ef", Psychic:"#ef4179", Bug:"#91a119", Rock:"#afa981", Ghost:"#704170", Dragon:"#5060e1", Dark:"#624d4e", Steel:"#60a1b8", Fairy:"#ef70ef" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const badge = (t) => `<span class="type" style="background:${TYPE[t] ?? "#555"}">${esc(t)}</span>`;
const hpColor = (p) => p > 50 ? "var(--good)" : p > 20 ? "var(--warn)" : "var(--bad)";
const eff = (e) => e >= 2 ? `<span class="eff2">×${e}</span>` : e === 0 ? `<span class="eff0">immune</span>` : e < 1 ? `<span class="effh">×${e}</span>` : "";
const dmgBar = (lo, hi) => `<div class="bar"><div style="left:0;width:${Math.min(100, lo)}%;background:var(--accent)"></div><div style="left:${Math.min(100, lo)}%;width:${Math.max(0, Math.min(100, hi) - Math.min(100, lo))}%;background:var(--accent);opacity:.45"></div></div>`;

function mon(side, m, est) {
  const pct = Math.round(100 * m.hp / m.maxHP);
  return `<div class="panel mon"><div class="side">${side}</div>
    <h2>${esc(m.name)} <small style="color:var(--muted);font-weight:400">Lv ${m.level}</small>${m.confused ? ` <span class="type" style="background:#b36bff">CONFUSED</span>` : ""}${m.dynamax ? ` <span class="type" style="background:#d6246e">DYNAMAX</span>` : ""}</h2>
    <div class="types">${m.types.map(badge).join("")}</div>
    <div class="hpbar"><div style="width:${pct}%;background:${hpColor(pct)}"></div></div>
    <div>${est ? `~${pct}% HP <span class="meta">(estimate)</span>` : `${m.hp}/${m.maxHP} HP (${pct}%)`} ${m.status ? `· <b>${esc(m.status.toUpperCase())}</b>` : ""}</div>
    ${Object.keys(m.boosts ?? {}).length ? `<div style="margin-top:6px">${Object.entries(m.boosts).map(([k, v]) =>
      `<span class="type" style="background:${v > 0 ? "var(--bad)" : "var(--accent)"}">${esc({ atk: "Atk", def: "Def", spa: "SpA", spd: "SpD", spe: "Spe", accuracy: "Acc", evasion: "Eva" }[k] ?? k)} ${v > 0 ? "+" : ""}${v}</span>`).join("")}</div>` : ""}
    <div class="meta">${m.ability === "???" ? revealBtn(m.name) : esc(m.ability)}${m.item ? " · " + esc(m.item) : ""} · Speed ${m.speed}</div></div>`;
}

const post = (u) => fetch(u, { method: "POST" });
// Hidden foe ability: Sam taps this after seeing the ability pop up in battle, and the advice redoes with it.
const revealBtn = (name) => `ability ??? <button class="reveal" onclick="post('/reveal?name=${encodeURIComponent(name)}')">I saw its ability</button>`;
const STATUS = {
  "no-emulator": "The emulator isn't running, or the game isn't loaded (Eden for Sword, melonDS for Black 2).",
  "waiting": "Waiting for a battle…",
};
function renderDoubles(d) {
  const D = d.doubles;
  for (const el of document.querySelectorAll(".versus, #moves, #meta, #catchPanel, #trainPanel")) el.closest(".panel, .versus, .meta").style.display = "none";
  const adv = d.doubleAdvice;
  const hpBar = (hp, max) => { const p = Math.round(100 * hp / max); return `<div class="hpbar"><div style="width:${p}%;background:${hpColor(p)}"></div></div><div class="meta">${hp}/${max} HP (${p}%)</div>`; };
  const header = `<div class="label">${D.ally ? "PARTNER BATTLE" : "DOUBLE BATTLE"} · ${D.actives.map((x) => esc(x.name)).join(" + ")}${D.ally ? ` (+ ${esc(D.ally.name)})` : ""} vs ${D.foes.map((f) => esc(f.name)).join(" + ")}</div>`;
  const recs = adv
    ? adv.actions.map((x) => `<div style="font-size:28px;font-weight:800;margin-top:6px">${esc(x.pokemon)}: ${esc(x.choice)} <span style="font-weight:400;color:var(--muted)">→ ${esc(x.target)}</span></div>`).join("") +
      `<div class="reason" style="margin-top:6px">${esc(adv.reason)}</div><div class="meta">${adv.model === "calculator" ? "calculator pick" : `${esc(adv.model)}, ${(adv.ms / 1000).toFixed(1)}s`}</div>`
    : `<div class="thinking">Thinking…</div>`;
  const risks = D.actives.filter((x) => x.koRisk.single || x.koRisk.focused).map((x) =>
    `<div style="background:var(--bad);color:#fff;border-radius:8px;padding:6px 10px;margin-top:8px;font-weight:700">⚠ ${esc(x.name)} can be KO'd ${x.koRisk.single ? "by one attack" : "if both foes target it"}</div>`).join("");
  document.getElementById("rec").innerHTML = header + recs + risks;
  const grid = D.actives.map((x) => `<div class="panel" style="margin-top:12px"><h3>${esc(x.name)} Lv ${x.level} · ${x.types.map(badge).join("")}</h3>${hpBar(x.hp, x.maxHP)}
    <table><tr><th>Move</th>${D.foes.map((f) => `<th>vs ${esc(f.name)}</th>`).join("")}<th>PP</th></tr>` +
    x.moves.map((m) => `<tr><td>${badge(m.type)} <b>${esc(m.move)}</b>${m.spread ? ` <span class="meta">(hits both)</span>` : ""}${m.hitsAlly ? ` <span style="color:var(--warn)">⚠ hits partner ${m.hitsAlly.pctMax[1]}%</span>` : ""}</td>` +
      m.vs.map((v) => `<td>${m.category === "Status" ? "<span class='meta'>status</span>" : `${v.pctMax[0]}–${v.pctMax[1]}%${v.ko ? " <b style='color:var(--good)'>KO</b>" : ""}`}</td>`).join("") + `<td>${m.pp ?? ""}</td></tr>`).join("") +
    `</table><div class="meta" style="margin-top:6px">Threats: ${x.threats.map((t) => `${esc(t.from)}'s ${esc(t.move ?? "–")} ${t.pctMax[1]}%${t.faster ? " (faster)" : ""}`).join(" · ")}</div></div>`).join("");
  const allyBox = D.ally ? `<div class="panel" style="margin-top:12px"><h3>Your ally (AI, not controlled)</h3><b>${esc(D.ally.name)}</b> Lv ${D.ally.level} ${D.ally.types.map(badge).join("")}${hpBar(D.ally.hp, D.ally.maxHP)}</div>` : "";
  const foes = allyBox + `<div class="panel" style="margin-top:12px"><h3>Opponents</h3>${D.foes.map((f) => `<div style="margin-bottom:8px"><b>${esc(f.name)}</b> Lv ${f.level} ${f.types.map(badge).join("")} <span class="meta">${f.ability === "???" ? revealBtn(f.name) : `ability ${esc(f.ability)}`} · speed ${f.speed}</span>${hpBar(f.hp, f.maxHP)}</div>`).join("")}</div>`;
  const pctC = (x) => x >= 0.995 ? "100%" : `${(100 * x).toFixed(x < 0.1 ? 1 : 0)}%`;
  const catchBox = d.catch && d.catch.odds.length ? `<div class="panel" style="margin-top:12px"><h3>Catching ${esc(D.foes[0].name)}? (per throw)</h3>
    <div style="font-size:24px;font-weight:800">${esc(d.catch.odds[0].ball)} · ${pctC(d.catch.odds[0].chance)}</div>
    <div class="meta" style="margin-top:6px">${d.catch.odds.map((o) => `${esc(o.ball)} ×${o.count}: <b style="color:var(--text)">${pctC(o.chance)}</b>`).join(" · ")}</div>` +
    ((d.catchKO ?? []).length ? `<div style="color:var(--bad);font-weight:700;margin-top:6px">⚠ Can KO it: ${d.catchKO.map(esc).join(", ")}</div>` : "") +
    `<div class="meta">Assumes dark grass with ≤30 species caught (×0.3); sleep ×2.5, paralysis ×1.5.</div></div>` : "";
  document.getElementById("rec").insertAdjacentHTML("beforeend", grid + catchBox + foes);
}

// Rotation battle: one pick (which of my 3 to rotate to the front + the move), judged against ALL their field Pokémon.
function renderRotation(d) {
  const R = d.rotation;
  for (const el of document.querySelectorAll(".versus, #moves, #meta, #catchPanel, #trainPanel")) el.closest(".panel, .versus, .meta").style.display = "none";
  const hpBar = (hp, max) => { const p = Math.round(100 * hp / max); return `<div class="hpbar"><div style="width:${p}%;background:${hpColor(p)}"></div></div><div class="meta">${hp}/${max} HP (${p}%)</div>`; };
  const P = R.pick;
  const header = `<div class="label">ROTATION BATTLE · ${R.actives.map((x) => esc(x.name.split(" (")[0])).join(" / ")} vs ${R.foes.map((f) => esc(f.name)).join(" / ")}</div>`;
  const rec = P ? `<div class="choice">${P.rotate ? `Rotate to ${esc(P.pokemon)}` : esc(P.pokemon)}: ${esc(P.move)}</div><div class="reason">${esc(P.reason)}</div>
    <div class="meta">Calculator pick: best against whichever of theirs ends up in front; safety assumes a max-roll crit.</div>` : `<div class="thinking">No usable move.</div>`;
  document.getElementById("rec").innerHTML = header + rec;
  const grid = R.actives.map((x) => `<div class="panel" style="margin-top:12px"><h3>${x.front ? "▶ FRONT · " : ""}${esc(x.name)} Lv ${x.level} · ${x.types.map(badge).join("")} <span class="meta">speed ${x.speed}</span></h3>${hpBar(x.hp, x.maxHP)}
    <table><tr><th>Move</th>${R.foes.map((f) => `<th>vs ${esc(f.name)}</th>`).join("")}<th>PP</th></tr>` +
    x.moves.map((m) => `<tr><td>${badge(m.type)} <b>${esc(m.move)}</b>${m.unsafeVs.length ? ` <span style="color:var(--bad)">⚠ ${esc(m.unsafeVs.join(", "))} can KO</span>` : ""}</td>` +
      m.vs.map((v) => `<td>${m.category === "Status" ? "<span class='meta'>status</span>" : `${v.pctMax[0]}–${v.pctMax[1]}%${v.ko ? " <b style='color:var(--good)'>KO</b>" : ""}`}</td>`).join("") + `<td>${m.pp ?? ""}</td></tr>`).join("") +
    `</table><div class="meta" style="margin-top:6px">Threats: ${x.threats.map((t) => `${esc(t.from)}'s ${esc(t.move ?? "–")} ${t.pct}% (crit ${t.critPct}%)${t.faster ? " · faster" : ""}${t.canKO ? " · <b style='color:var(--bad)'>can KO</b>" : ""}`).join(" · ")}</div></div>`).join("");
  const foes = `<div class="panel" style="margin-top:12px"><h3>Opponents on the field</h3>${R.foes.map((f) => `<div style="margin-bottom:8px">${f.front ? "▶ " : ""}<b>${esc(f.name)}</b> Lv ${f.level} ${f.types.map(badge).join("")} <span class="meta">${f.ability === "???" ? revealBtn(f.name) : `ability ${esc(f.ability)}`} · speed ${f.speed}</span>${hpBar(f.hp, f.maxHP)}</div>`).join("")}</div>`;
  document.getElementById("rec").insertAdjacentHTML("beforeend", grid + foes);
}

// Level-up move offers: a box only when the game is asking right now; upcoming ones as one small line.
function skipStep(btn, id) {
  btn.closest("div").style.opacity = .4;
  fetch(`/plan-skip?id=${id}`, { method: "POST" });
}

function levelUpBox(d) {
  const tips = d.newMoves ?? [];
  const now = tips.filter((t) => t.when === "now"), next = tips.filter((t) => t.when === "next");
  const advice = (t) => t.skip ? `<b>don't learn it</b>` : t.forget ? `forget <b>${esc(t.forget)}</b>` : `learns it (free slot)`;
  const box = now.map((t) => `<div style="margin-top:12px;padding:10px;border-radius:8px;background:rgba(62,207,142,.12);border:1px solid var(--good)">
    <span class="label" style="color:var(--good)">NEW MOVE · ${esc(t.pokemon)} Lv ${t.level} wants ${esc(t.move)}</span>
    <div style="font-size:22px;font-weight:800;margin-top:4px">${t.skip ? `Don't learn ${esc(t.move)}` : t.forget ? `Forget ${esc(t.forget)} → learn ${esc(t.move)}` : `Learns ${esc(t.move)} (free slot)`}</div>
    <div class="meta">${esc(t.why)}</div></div>`).join("");
  const line = next.length ? `<div class="meta" style="margin-top:10px">Coming up: ${next.map((t) => `${esc(t.pokemon.split(" (")[0])} Lv ${t.level} ${esc(t.move)} → ${advice(t)}`).join(" · ")}</div>` : "";
  return box + line;
}

// Staying in with this move can still lose the Pokémon (a crit, a high roll): say so in red with the odds (Sam, 10-06).
function faintBanner(a, adv) {
  if (!adv || adv.action !== "move" || a.between) return "";
  const mv = (a.myMoves ?? []).find((m) => m.move === adv.choice);
  const r = mv?.faintRisk ?? 0;
  if (r <= 0) return "";
  const p = r < 0.01 ? "<1" : Math.round(100 * r);
  const why = a.koRisk?.maxRoll ? `${esc(a.koRisk.move)} can KO without a crit` : `a crit ${esc(a.koRisk?.move ?? "hit")} can KO`;
  const trapped = a.trapped ? ` No switch possible (${esc(a.trapped)}).` : !(a.switches ?? []).length ? " No switch-in survives it." : "";
  return `<div style="background:var(--bad);color:#fff;border-radius:8px;padding:8px 12px;margin-top:10px;font-weight:700">⚠ ${p}% chance ${esc(a.me.name.split(" (")[0])} faints this turn: ${why}.${trapped}</div>`;
}

function render(d) {
  if (d.rotation) { renderRotation(d); document.getElementById("rec").insertAdjacentHTML("afterbegin", levelUpBox(d)); return; }
  if (d.doubles) { renderDoubles(d); document.getElementById("rec").insertAdjacentHTML("afterbegin", levelUpBox(d)); return; }
  const a = d.analysis;
  const hide = !a;
  for (const el of document.querySelectorAll(".versus, #moves, #meta")) el.closest(".panel, .versus, .meta").style.display = hide ? "none" : "";
  if (!a) {
    const heal = (d.topUp ?? []).length
      ? `<div style="margin-top:12px"><span class="label" style="color:var(--warn)">HEAL BEFORE THE NEXT FIGHT</span>` +
        d.topUp.map((m) => `<div style="font-size:18px;margin-top:4px"><b>${esc(m.name)}</b> ${m.hp}/${m.maxHP}${m.item ? ` → ${esc(m.item)}` : ""}</div>`).join("") + `</div>`
      : "";
    // Plan steps flash open when there's something new, then fold into one line; a short reminder every 15 min.
    const ids = (d.planSteps ?? []).map((x) => x.id);
    if (ids.some((id) => !seenSteps.has(id))) { ids.forEach((id) => seenSteps.add(id)); openUntil = Date.now() + 45_000; }
    const open = Date.now() < openUntil;
    if (open) { clearTimeout(foldTimer); foldTimer = setTimeout(() => render(lastData), openUntil - Date.now() + 100); }
    const folded = ids.length && !open
      ? `<div style="margin-top:6px;cursor:pointer" onclick="openUntil = Date.now() + 60_000; render(lastData)">📋 <b>${ids.length} bag tip${ids.length > 1 ? "s" : ""}</b> <span class="meta">(tap to show)</span></div>` : "";
    const steps = folded || (d.planSteps ?? []).map((x) => `<div style="margin-top:6px;display:flex;gap:8px;align-items:baseline">
        <button onclick="skipStep(this, '${encodeURIComponent(x.id)}')" title="Skip this step (won't be suggested again)"
          style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;cursor:pointer;padding:0 6px">✕</button>
        <div>📋 <b>${esc(x.text)}</b><div class="meta">${esc(x.why)}</div></div></div>`).join("");
    const flash = open && ids.length ? ' class="flash"' : "";
    const bag = (d.bagTips ?? []).length || steps
      ? `<div style="margin-top:12px"${flash}><span class="label" style="color:var(--accent)">BAG TIPS</span>` + steps +
        (d.bagTips ?? []).map((t) => `<div style="margin-top:4px">• ${esc(t)}</div>`).join("") + `</div>`
      : "";
    const next = d.nextPick ? `<div class="label">THEIR NEXT POKÉMON ISN'T OUT YET · ${d.nextPick.action === "switch" ? "SWITCH TO" : ""}</div>
      <div class="choice">${esc(d.nextPick.choice)}</div><div class="reason">${esc(d.nextPick.reason)}</div>` : "";
    document.getElementById("rec").innerHTML = next || `<div class="thinking">${esc(STATUS[d.status] ?? d.status)}</div>${levelUpBox(d)}${heal}${bag}`;
    return;
  }
  document.getElementById("versus").innerHTML = mon("You", a.me) + mon(a.trainer ? "Trainer's" : "Wild", a.enemy, d.estimated);
  if (a.enemyBench.length) document.querySelectorAll("#versus .mon")[1].insertAdjacentHTML("beforeend",
    `<div class="meta">Still to come: ${a.enemyBench.map((m) => `${esc(m.name)} Lv ${m.level}`).join(", ")}</div>`);
  const rec = document.getElementById("rec");
  if (d.advice) {
    rec.innerHTML = `<div class="label">${a.between ? `NEXT UP: ${esc(a.enemy.name)}${a.enemy.dynamax ? " (expect Dynamax)" : ""} · ` : ""}${d.advice.model === "calculator" ? (d.advice.rejected ? "SAFE PICK (calculator)" : "CALCULATOR PICK (AI timed out)") : "RECOMMENDED"} · ${d.advice.action === "switch" ? "SWITCH TO" : d.advice.choice === "Stay" ? "DON'T SWITCH" : d.advice.action === "item" ? "USE ITEM" : d.advice.action === "run" ? "RUN AWAY" : "USE"}</div>
      <div class="choice">${d.advice.choice === "Stay" ? `Stay in with ${esc(a.me.name.split(" (")[0])}` : esc(d.advice.choice)}</div><div class="reason">${esc(d.advice.reason)}</div>
      <div class="alt">Alternative: ${esc(d.advice.alternative)}</div>
      ${d.advice.rejected ? `<div class="meta" style="margin-top:8px">✋ ${esc(d.advice.rejected)}</div>` : ""}
      ${faintBanner(a, d.advice)}`;
  } else if (d.error) {
    rec.innerHTML = `<div class="label">ADVICE UNAVAILABLE</div><div class="reason">${esc(d.error)}</div><div class="alt">The damage numbers below are still accurate.</div>`;
  } else {
    rec.innerHTML = `<div class="thinking">Thinking…</div>`;
  }
  if (a.swap && !(d.advice?.action === "switch" && d.advice.choice === a.swap.to)) {
    rec.insertAdjacentHTML("beforeend", `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <span class="label" style="color:var(--warn)">BETTER MATCHUP · SWAP TO</span>
      <div style="font-size:26px;font-weight:800">${esc(a.swap.to)}</div><div class="meta">${esc(a.swap.reason)}</div></div>`);
  }
  if (d.heal && d.advice?.action !== "item") {
    rec.insertAdjacentHTML("beforeend", `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <span class="label" style="color:var(--good)">HEAL OPTION</span>
      <div style="font-size:22px;font-weight:700">${esc(d.heal.item)} on ${esc(d.heal.target)} <span class="meta">(×${d.heal.count})</span></div>
      <div class="meta">${esc(d.heal.reason)}</div></div>`);
  }
  if (d.cure && d.advice?.action !== "item") {
    const label = { slp: "asleep", par: "paralyzed", brn: "burned", psn: "poisoned", tox: "badly poisoned", frz: "frozen" }[d.cure.status] ?? d.cure.status;
    rec.insertAdjacentHTML("beforeend", `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <span class="label" style="color:var(--good)">CURE OPTION</span>
      <div style="font-size:22px;font-weight:700">${esc(d.cure.item)} on ${esc(d.cure.target)} <span class="meta">(${label}, ×${d.cure.count})</span></div></div>`);
  }
  if (a.dynamaxOption?.recommend && !/dynamax/i.test(d.advice?.choice ?? "")) {
    rec.insertAdjacentHTML("beforeend", `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
      <span class="label" style="color:#ff5fa2">DYNAMAX NOW</span>
      <div style="font-size:22px;font-weight:700">Dynamax ${esc(a.me.name)} → ${esc(a.dynamaxOption.best.move)}</div>
      <div class="meta">${esc(a.dynamaxOption.recommend)}</div></div>`);
  } else if (a.dynamaxOption?.best) {
    const o = a.dynamaxOption;
    rec.insertAdjacentHTML("beforeend", `<div class="meta" style="margin-top:10px">If you Dynamax: <b style="color:var(--text)">${esc(o.best.move)}</b> (from ${esc(o.best.from)}) does ${o.best.pctMax.join("–")}% ${o.best.ko ? `(${esc(o.best.ko)})` : ""}; ${esc(a.enemy.name)}'s best hit would do ${o.takesWorst?.pctMax.join("–") ?? 0}% to your doubled HP.</div>`);
  }
  rec.insertAdjacentHTML("afterbegin", levelUpBox(d));
  const best = d.advice?.action === "move" ? d.advice.choice : null;
  const scaleNote = a.damageScale && a.damageScale !== 1 ? `<tr><td colspan="6" class="meta">Adjusted to real hits on ${esc(a.enemy.name)}: your attacks do about ${Math.round(a.damageScale * 100)}% of the predicted damage.</td></tr>` : "";
  document.getElementById("moves").innerHTML = scaleNote + `<tr><th>Move</th><th>Type</th><th>Damage (% max HP)</th><th></th><th>KO</th><th>PP</th></tr>` +
    a.myMoves.map((m) => `<tr class="${m.move === best ? "best" : ""}"><td><b>${esc(m.move)}</b></td><td>${badge(m.type)}</td>
      <td>${m.category === "Status" ? "<span class='meta'>status</span>" : dmgBar(...m.pctMax)}</td>
      <td>${m.category === "Status" ? "" : `${m.pctMax[0]}–${m.pctMax[1]}% ${eff(m.effectiveness)}`}</td><td>${esc(m.ko)}</td><td>${m.pp}</td></tr>`).join("");
  document.getElementById("threats").innerHTML = `<tr><th>Move</th><th>Damage to ${esc(a.me.name)}</th><th>PP</th></tr>` +
    a.enemyMoves.map((m) => `<tr><td>${badge(m.type)} ${esc(m.maxMove ?? m.move)}</td><td>${m.category === "Status" ? "status" : `${m.pctMax[0]}–${m.pctMax[1]}% ${eff(m.effectiveness)}`}</td><td>${m.pp ?? ""}</td></tr>`).join("") +
    (a.enemyOutOfPP?.length ? `<tr><td colspan="3" class="meta">Out of PP (can't be used): ${a.enemyOutOfPP.map(esc).join(", ")}</td></tr>` : "");
  document.getElementById("switches").innerHTML = `<tr><th>Pokémon</th><th>Takes (worst)</th><th>Deals (best)</th></tr>` +
    a.switches.map((s) => `<tr class="${d.advice?.action === "switch" && d.advice.choice === s.name ? "best" : ""}"><td><b>${esc(s.name)}</b> ${s.types.map(badge).join("")}<div class="meta">${s.hp} HP${s.status ? ` · <b style="color:var(--warn)">${esc(s.status.toUpperCase())}</b>` : ""}</div></td>
      <td>${s.takesWorst ? `${s.takesWorst.pctMax[1]}% <span class="meta">${esc(s.takesWorst.move)}</span>` : "–"}</td>
      <td>${s.bestMove ? `${s.bestMove.pctMax[1]}% <span class="meta">${esc(s.bestMove.move)}</span>` : "–"}</td></tr>`).join("");
  const ups = Object.entries(a.enemy.boosts ?? {}).filter(([, v]) => v > 0);
  if (ups.length) {
    rec.insertAdjacentHTML("afterbegin", `<div style="background:var(--warn);color:#000;border-radius:8px;padding:6px 10px;margin-bottom:10px;font-weight:700">
      ⚠ ${esc(a.enemy.name)} IS SETTING UP (${ups.map(([k, v]) => `${esc(k.toUpperCase())} +${v}`).join(", ")}). It gets stronger every turn: KO it now or switch to a counter.</div>`);
  }
  if (d.nuzlocke && a.koRisk && (a.koRisk.maxRoll || a.koRisk.withCrit)) {
    rec.insertAdjacentHTML("afterbegin", `<div style="background:var(--bad);color:#fff;border-radius:8px;padding:6px 10px;margin-bottom:10px;font-weight:700">
      ⚠ KO RISK: ${esc(a.koRisk.move)} can knock out ${esc(a.me.name)} this turn${a.koRisk.maxRoll ? " (max roll)" : " (with a crit)"}</div>`);
  }
  const tp = document.getElementById("trainPanel");
  if (d.training) {
    tp.style.display = "";
    const t = d.training;
    document.getElementById("trainTitle").textContent = `Training → Lv ${t.target}`;
    const lo = Math.min(...t.members.map((m) => m.level)) - 1;
    document.getElementById("train").innerHTML =
      `<div style="font-size:18px;font-weight:600;margin-bottom:8px">${esc(t.tip)}</div>` +
      t.warnings.map((w) => `<div style="color:var(--warn)">⚠ ${esc(w)}</div>`).join("") +
      `<table style="margin-top:6px"><tr><th>Pokémon</th><th>Level</th><th>Toward Lv ${t.target}</th><th>EXP from this KO</th></tr>` +
      t.members.map((m) => {
        const pct = Math.min(100, 100 * (m.level + m.progress - lo) / (t.target - lo));
        return `<tr><td><b>${esc(m.name)}</b>${m.active ? " <span class='meta'>(out)</span>" : ""}${m.participant && !m.active ? " <span class='meta'>(full EXP)</span>" : ""}</td>
          <td>${m.level}<span class="meta">.${Math.floor(m.progress * 10)}</span></td>
          <td><div class="bar"><div style="width:${pct}%;background:${m.atCap ? "var(--warn)" : "var(--good)"}"></div></div></td>
          <td>${m.participant || m.active ? `+${m.gainIfOut}` : `+${m.gainIfBench} <span class="meta">(+${m.gainIfOut} if it comes out)</span>`}</td></tr>`;
      }).join("") + `</table>`;
  } else tp.style.display = "none";
  const cp = document.getElementById("catchPanel");
  if (d.catch && d.catch.odds.length) {
    cp.style.display = "";
    const pct = (x) => x >= 0.995 ? "100%" : `${(100 * x).toFixed(x < 0.1 ? 1 : 0)}%`;
    const top = d.catch.odds[0];
    document.getElementById("catch").innerHTML =
      `<div style="font-size:26px;font-weight:800">${esc(top.ball)} · ${pct(top.chance)}</div>` +
      (d.catch.levelPenalty ? `<div style="color:var(--warn);margin:4px 0">⚠ ${esc(a.enemy.name)} is higher level than ${esc(a.me.name)}: catch chance is cut ~90%. Switch to a higher-level Pokémon before throwing.</div>` : "") +
      `<div class="meta" style="margin-top:6px">${d.catch.odds.map((o) => `${esc(o.ball)} ×${o.count}: <b style="color:var(--text)">${pct(o.chance)}</b>${o.note ? ` <i>(${esc(o.note)})</i>` : ""}`).join(" · ")}</div>` +
      `<div class="meta">Based on the estimated HP; lower HP and sleep/paralysis raise it.</div>`;
  } else cp.style.display = "none";
  document.getElementById("meta").textContent =
    (a.run ? `Run: ${a.run.chance >= 1 ? "always escapes (you're faster)" : `${Math.round(a.run.chance * 100)}% to escape`} · ` : "") +
    `${a.iMoveFirst === true ? "You move first" : a.iMoveFirst === false ? "Enemy moves first" : "Speed tie"} · updated ${new Date(d.at).toLocaleTimeString()}` +
    (d.advice ? ` · ${d.advice.model}, ${(d.advice.ms / 1000).toFixed(1)}s` : "");
}

let lastData = null, openUntil = 0, foldTimer = 0;
const seenSteps = new Set();
// Reconnect on our own: after a server restart Firefox's EventSource sometimes gives up and the page sits on stale
// data, so drop the stream and reopen it every 2 s until messages flow again.
let es = null;
function connect() {
  es?.close();
  es = new EventSource("/events");
  es.onmessage = (e) => { lastData = JSON.parse(e.data); render(lastData); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
connect();

// Support note: never during a battle or while tips are flashing; first after 10 min, then at most every 45 min,
// for 15 s. ✕ snoozes it for a week (per browser).
const SUPPORT_ON = document.body.dataset.support === "1";
let supportShownAt = Date.now() - 35 * 60_000, supportTimer = 0;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function hideSupport(snooze) {
  document.getElementById("support").classList.remove("show");
  if (snooze) store.set("pba-support-snooze", String(Date.now() + 7 * 864e5));
}
setInterval(() => {
  if (!SUPPORT_ON || document.hidden) return;
  if (Number(store.get("pba-support-snooze") ?? 0) > Date.now()) return;
  const quiet = lastData && lastData.status !== "battle" && !lastData.newMoves?.length && Date.now() > openUntil;
  if (!quiet || Date.now() - supportShownAt < 45 * 60_000) return;
  supportShownAt = Date.now();
  document.getElementById("support").classList.add("show");
  clearTimeout(supportTimer); supportTimer = setTimeout(() => hideSupport(false), 15_000);
}, 30_000);
// Fold the tips back up after their flash, and re-flash them every 15 minutes.
setInterval(() => { if (lastData?.planSteps?.length) { openUntil = Date.now() + 30_000; render(lastData); } }, 15 * 60_000);
</script>
</body>
</html>
